name: Build Miracle MSM8953

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name (for permissive type [a02q_permissive_defconfig])"
        required: true
        default: "a02q_defconfig"
      use_author_defconfig:
        description: "Use a02q touchgrass kernel defconfig (this is exprimental and not recommended ! try at your own risk !!!"
        required: true
        type: boolean
        default: false
      stock_boot_url:
        description: "Optional direct URL to stock boot.img (otherwise s-kernel/boot.img from the repo is used)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      DEFCONFIG: ${{ github.event.inputs.defconfig || 'a02q_defconfig' }}
      USE_AUTHOR_DEFCONFIG: ${{ github.event.inputs.use_author_defconfig || 'false' }}
      STOCK_BOOT_URL: ${{ github.event.inputs.stock_boot_url }}
      ALLOW_UNSAFE_WARNINGS: 1
      AUTHOR_DEFCONFIG_URL: https://raw.githubusercontent.com/micr0softstore/samsung_android_kernel_a02q/main/arch/arm64/configs/a02q_defconfig

    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Helpers (retry for flaky downloads, make wrapper)
        run: |
          cat > "$RUNNER_TEMP/retry.sh" <<'EOF'
          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then return 1; fi
              echo "retry $n/3: $*"
              sleep $((n*5))
            done
          }
          EOF
          cat > "$RUNNER_TEMP/mk.sh" <<'EOF'
          mk() {
            local dtc py2
            if [ -f tools/dtc ]; then chmod +x tools/dtc; dtc="$PWD/tools/dtc"; else dtc="$(command -v dtc)"; fi
            py2="$(command -v python2 || command -v python3)"
            make -j"$(nproc)" O="$PWD/out" ARCH=arm64 \
              CROSS_COMPILE="$PWD/toolchain/bin/aarch64-linux-android-" \
              "HOSTCC=gcc -fcommon -Wno-deprecated-declarations" \
              PYTHON="$py2" DTC_EXT="$dtc" CONFIG_BUILD_ARM64_DT_OVERLAY=y "$@"
          }
          EOF
          mkdir -p work artifacts out

      - name: Restore exec bits
        run: |
          find . -path ./.git -prune -o -type f \
            \( -name '*.sh' -o -name '*.py' -o -name '*.pl' -o -path './scripts/*' -o -path './tools/*' \) \
            -exec chmod +x {} +

      - name: Install build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            device-tree-compiler python3 cpio xz-utils git wget binutils
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends python2 || echo "python2 not available, using python3"

      # The original author's build_kernel.sh builds with the Android GCC 4.9 toolchain
      # (toolchain/bin/aarch64-linux-android-). Same compiler here, no clang.
      - name: Get GCC 4.9 toolchain
        run: |
          GOOGLE=https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          LINEAGE=https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          # the default branch of the AOSP repo no longer contains the compiler,
          # so try release branches that still do, and accept a source only if the binary exists
          CANDIDATES=(
            "$GOOGLE android11-release"
            "$GOOGLE android10-release"
            "$GOOGLE pie-release"
            "$LINEAGE lineage-18.1"
            "$LINEAGE lineage-17.1"
            "$LINEAGE lineage-19.1"
          )
          found=0
          for c in "${CANDIDATES[@]}"; do
            set -- $c
            echo "Trying $1 (branch $2)"
            rm -rf toolchain
            if git clone -q --depth=1 -b "$2" "$1" toolchain && [ -x toolchain/bin/aarch64-linux-android-gcc ]; then
              echo "Using $1 (branch $2)"
              found=1
              break
            fi
          done
          if [ "$found" != 1 ]; then
            echo "::error::Could not get an aarch64-linux-android-4.9 toolchain from any source"
            exit 1
          fi
          toolchain/bin/aarch64-linux-android-gcc --version | head -n1

      - name: Check defconfig exists
        run: |
          if [ ! -f "arch/$ARCH/configs/$DEFCONFIG" ]; then
            echo "Defconfig '$DEFCONFIG' not found. Available:"
            ls arch/$ARCH/configs
            exit 1
          fi

      - name: Compare defconfig with the original author's
        run: |
          source "$RUNNER_TEMP/retry.sh"
          retry wget -q -O work/author_defconfig "$AUTHOR_DEFCONFIG_URL"
          echo "=============== defconfig differences: author (-) vs this repo (+) ==============="
          diff -u work/author_defconfig "arch/$ARCH/configs/$DEFCONFIG" > work/defconfig.diff || true
          cat work/defconfig.diff
          echo "=============== end of differences ==============="
          cp work/defconfig.diff artifacts/defconfig.diff
          if [ "$USE_AUTHOR_DEFCONFIG" = "true" ]; then
            echo "::warning::use_author_defconfig is ON, building with the author's defconfig instead of yours"
            cp work/author_defconfig "arch/$ARCH/configs/$DEFCONFIG"
          fi

      - name: Configure
        run: |
          source "$RUNNER_TEMP/mk.sh"
          mk "$DEFCONFIG"

      - name: Config report
        run: |
          source "$RUNNER_TEMP/mk.sh"
          echo "Kernel release: $(mk -s kernelrelease 2>/dev/null | tail -n1)"
          grep -E '^(# )?CONFIG_(LOCALVERSION|DM_VERITY|DM_ANDROID_VERITY|CC_STACKPROTECTOR|LTO|CC_OPTIMIZE|MODVERSIONS|MODULE_FORCE|BUILD_ARM64_APPENDED_DTB_IMAGE)' out/.config || true
          if grep -q '^# CONFIG_DM_VERITY is not set' out/.config; then
            echo "::warning::CONFIG_DM_VERITY is disabled. With verified boot still enabled on the phone this commonly causes a bootloop. Flash the vbmeta tar too."
          fi

      - name: Build
        run: |
          source "$RUNNER_TEMP/mk.sh"
          # full log goes to build.log, only the compiler-support spam is hidden on the console
          mk 2>&1 | tee build.log | { grep -viE 'gcc.*unsupported|unsupported.*gcc' || true; }

      - name: Pick kernel image
        run: |
          K=out/arch/arm64/boot/Image
          if [ ! -f "$K" ]; then
            echo "No $K produced. Contents of out/arch/arm64/boot:"
            ls -la out/arch/arm64/boot || true
            exit 1
          fi
          echo "KERNEL_IMAGE=$K" >> "$GITHUB_ENV"
          cp "$K" artifacts/Image
          ls -lh "$K"
          strings -a "$K" | grep -m1 'Linux version' || true

      - name: Get stock boot.img
        id: stock
        run: |
          source "$RUNNER_TEMP/retry.sh"
          if [ -n "$STOCK_BOOT_URL" ]; then
            retry wget -q -O work/stock_boot.img "$STOCK_BOOT_URL"
          elif [ -f s-kernel/boot.img ]; then
            cp s-kernel/boot.img work/stock_boot.img
          elif [ -f stock/boot.img ]; then
            cp stock/boot.img work/stock_boot.img
          fi
          if [ -s work/stock_boot.img ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No stock boot.img found (s-kernel/boot.img, stock/boot.img or stock_boot_url), only the raw kernel was built."
          fi

      - name: Repack boot.img
        if: steps.stock.outputs.have == 'true'
        run: |
          source "$RUNNER_TEMP/retry.sh"
          retry git clone -q --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg work/mkbootimg
          retry git clone -q --depth 1 https://android.googlesource.com/platform/external/avb work/avb
          cd work

          python3 mkbootimg/unpack_bootimg.py \
            --boot_img stock_boot.img \
            --out unpacked \
            --format=mkbootimg > mkargs.txt
          echo "---- stock boot.img parameters ----"
          cat mkargs.txt
          echo "-----------------------------------"
          ls -la unpacked
          cp mkargs.txt "$GITHUB_WORKSPACE/artifacts/mkargs.txt"

          OLD=$(stat -c %s unpacked/kernel)
          NEW=$(stat -c %s "$GITHUB_WORKSPACE/$KERNEL_IMAGE")
          echo "stock kernel: $OLD bytes, new kernel: $NEW bytes"
          cp "$GITHUB_WORKSPACE/$KERNEL_IMAGE" unpacked/kernel

          python3 - <<'PY'
          import shlex, subprocess
          args = shlex.split(open('mkargs.txt').read())
          cmd = ['python3', 'mkbootimg/mkbootimg.py', *args, '-o', 'boot.img']
          print('Running:', ' '.join(cmd))
          subprocess.run(cmd, check=True)
          PY

          # Samsung marker: only add it if the stock image had it
          if tail -c 16 stock_boot.img | grep -aq 'SEANDROIDENFORCE'; then
            printf 'SEANDROIDENFORCE' >> boot.img
            echo "Appended SEANDROIDENFORCE marker"
          fi

          # boot.img only, as requested
          tar -H ustar -cf "$GITHUB_WORKSPACE/artifacts/boot.img.tar" boot.img

          # second tar with a verification-disabled vbmeta for Odin (AP slot)
          python3 avb/avbtool.py make_vbmeta_image \
            --flags 2 --padding_size 4096 --output vbmeta.img
          tar -H ustar -cf "$GITHUB_WORKSPACE/artifacts/boot_plus_vbmeta.tar" boot.img vbmeta.img

          ls -lh boot.img stock_boot.img "$GITHUB_WORKSPACE"/artifacts/*.tar

      - uses: actions/upload-artifact@v4
        with:
          name: Miracle-MSM8953
          path: artifacts/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore