name: Build Miracle MSM8953

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name (for permissive type [a02q_permissive_defconfig])"
        required: true
        default: "a02q_defconfig"
      use_author_defconfig:
        description: "Use a02q touchgrass kernel defconfig (this is exprimental and not recommended ! try at your own risk !!!)"
        required: true
        type: boolean
        default: false
      compiler:
        description: "Compiler (clang uses AOSP clang r450784d, binutils from GCC)"
        required: true
        type: choice
        options:
          - gcc
          - clang
        default: gcc
      gcc_version:
        description: "GCC version (4.9 = Android prebuilt like the original author, 5.1 = Linaro GCC 5.1-2015.08)"
        required: true
        type: choice
        options:
          - "5.1"
          - "4.9"
        default: "5.1"
      upload_modules:
        description: "Also upload the built kernel modules (.ko files) as a separate artifact"
        required: true
        type: boolean
        default: false
      stock_boot_url:
        description: "Optional direct URL to stock boot.img (otherwise s-kernel/boot.img from the repo is used)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 67

    env:
      ARCH: arm64
      DEFCONFIG: ${{ github.event.inputs.defconfig || 'a02q_defconfig' }}
      USE_AUTHOR_DEFCONFIG: ${{ github.event.inputs.use_author_defconfig || 'false' }}
      COMPILER: ${{ github.event.inputs.compiler || 'gcc' }}
      GCC_VERSION: ${{ github.event.inputs.gcc_version || '4.9' }}
      UPLOAD_MODULES: ${{ github.event.inputs.upload_modules || 'false' }}
      STOCK_BOOT_URL: ${{ github.event.inputs.stock_boot_url }}
      ALLOW_UNSAFE_WARNINGS: 1
      AUTHOR_DEFCONFIG_URL: https://raw.githubusercontent.com/micr0softstore/samsung_android_kernel_a02q/main/arch/arm64/configs/a02q_defconfig

    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Helpers (retry for flaky downloads, make wrapper)
        run: |
          cat > "$RUNNER_TEMP/retry.sh" <<'EOF'
          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then return 1; fi
              echo "retry $n/3: $*"
              sleep $((n*5))
            done
          }
          EOF
          cat > "$RUNNER_TEMP/mk.sh" <<'EOF'
          mk() {
            local dtc py2 prefix cc=()
            if [ "$GCC_VERSION" = "5.1" ]; then prefix=aarch64-linux-gnu-; else prefix=aarch64-linux-android-; fi
            if [ -f tools/dtc ]; then chmod +x tools/dtc; dtc="$PWD/tools/dtc"; else dtc="$(command -v dtc)"; fi
            py2="$(command -v python2 || command -v python3)"
            if [ "$COMPILER" = "clang" ]; then
              cc=(CC="$PWD/clang/bin/clang" CLANG_TRIPLE=aarch64-linux-gnu-)
            fi
            make -j"$(nproc)" O="$PWD/out" ARCH=arm64 \
              CROSS_COMPILE="$PWD/toolchain/bin/$prefix" "${cc[@]}" \
              "HOSTCC=gcc -fcommon -Wno-deprecated-declarations" \
              PYTHON="$py2" DTC_EXT="$dtc" CONFIG_BUILD_ARM64_DT_OVERLAY=y "$@"
          }
          EOF
          mkdir -p work artifacts out

      - name: Restore exec bits
        run: |
          find . -path ./.git -prune -o -type f \
            \( -name '*.sh' -o -name '*.py' -o -name '*.pl' -o -path './scripts/*' -o -path './tools/*' \) \
            -exec chmod +x {} +

      - name: Install build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            device-tree-compiler python3 cpio xz-utils git wget binutils
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends python2 || echo "python2 not available, using python3"

      # The original author's build_kernel.sh builds with the Android GCC 4.9 toolchain
      # (toolchain/bin/aarch64-linux-android-). With clang it still provides as/ld.
      - name: Get GCC 4.9 toolchain
        if: env.GCC_VERSION == '4.9'
        run: |
          GOOGLE=https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          LINEAGE=https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          # the default branch of the AOSP repo no longer contains the compiler,
          # so try release branches that still do, and accept a source only if the binary exists
          CANDIDATES=(
            "$GOOGLE android11-release"
            "$GOOGLE android10-release"
            "$GOOGLE pie-release"
            "$LINEAGE lineage-18.1"
            "$LINEAGE lineage-17.1"
            "$LINEAGE lineage-19.1"
          )
          found=0
          for c in "${CANDIDATES[@]}"; do
            set -- $c
            echo "Trying $1 (branch $2)"
            rm -rf toolchain
            if git clone -q --depth=1 -b "$2" "$1" toolchain && [ -x toolchain/bin/aarch64-linux-android-gcc ]; then
              echo "Using $1 (branch $2)"
              found=1
              break
            fi
          done
          if [ "$found" != 1 ]; then
            echo "::error::Could not get an aarch64-linux-android-4.9 toolchain from any source"
            exit 1
          fi
          sed -i '/self.print_deprecation_warning()$/d' toolchain/bin/aarch64-linux-android-gcc
          toolchain/bin/aarch64-linux-android-gcc --version | head -n1

      # Linaro's GCC 5.1 uses the aarch64-linux-gnu- prefix (mk.sh picks it automatically)
      - name: Get GCC 5.1 toolchain (Linaro 5.1-2015.08)
        if: env.GCC_VERSION == '5.1'
        run: |
          # A server error page also "downloads" fine, so check that the file really is an xz archive.
          fetch_xz() {
            local url="$1" dest="$2"
            rm -f "$dest"
            echo "Downloading $url"
            if ! wget -q --tries=2 --timeout=120 -U "Mozilla/5.0" -O "$dest" "$url"; then
              echo "download failed"
              return 1
            fi
            if xz -t "$dest" 2>/dev/null; then
              echo "OK, valid xz archive ($(stat -c %s "$dest") bytes)"
              return 0
            fi
            echo "Not a valid xz file. Size: $(stat -c %s "$dest") bytes. Start of the file:"
            head -c 300 "$dest" | tr -c '[:print:]\n' '?'
            echo
            return 1
          }

          P51=components/toolchain/binaries/5.1-2015.08/aarch64-linux-gnu/gcc-linaro-5.1-2015.08-x86_64_aarch64-linux-gnu.tar.xz
          ok=0
          for u in \
            "https://releases.linaro.org/$P51" \
            "http://releases.linaro.org/$P51" \
            "https://releases-ie.linaro.org/$P51" \
            "http://releases-ie.linaro.org/$P51"; do
            if fetch_xz "$u" work/gcc.tar.xz; then ok=1; break; fi
          done

          if [ "$ok" != 1 ]; then
            echo "::warning::Linaro GCC 5.1 could not be downloaded, falling back to another Linaro GCC 5.x"
            for u in \
              "http://releases.linaro.org/components/toolchain/binaries/5.2-2015.11-2/aarch64-linux-gnu/gcc-linaro-5.2-2015.11-2-x86_64_aarch64-linux-gnu.tar.xz" \
              "https://releases.linaro.org/components/toolchain/binaries/5.4-2017.05/aarch64-linux-gnu/gcc-linaro-5.4.1-2017.05-x86_64_aarch64-linux-gnu.tar.xz" \
              "https://releases.linaro.org/components/toolchain/binaries/5.5-2017.10/aarch64-linux-gnu/gcc-linaro-5.5.0-2017.10-x86_64_aarch64-linux-gnu.tar.xz"; do
              if fetch_xz "$u" work/gcc.tar.xz; then ok=1; break; fi
            done
          fi

          if [ "$ok" != 1 ]; then
            echo "::error::Could not download any Linaro GCC 5.x toolchain. See the log above for what the server returned."
            exit 1
          fi

          rm -rf toolchain
          mkdir toolchain
          tar -xf work/gcc.tar.xz -C toolchain --strip-components=1
          rm -f work/gcc.tar.xz
          toolchain/bin/aarch64-linux-gnu-gcc --version | head -n1

      - name: Get clang
        if: env.COMPILER == 'clang'
        run: |
          source "$RUNNER_TEMP/retry.sh"
          retry git clone -q --depth=1 https://gitlab.com/tejas101k/clang-r450784d.git clang
          clang/bin/clang --version | head -n1

      - name: Check defconfig exists
        run: |
          if [ ! -f "arch/$ARCH/configs/$DEFCONFIG" ]; then
            echo "Defconfig '$DEFCONFIG' not found. Available:"
            ls arch/$ARCH/configs
            exit 1
          fi

      - name: Compare defconfig with the original author's
        run: |
          source "$RUNNER_TEMP/retry.sh"
          retry wget -q -O work/author_defconfig "$AUTHOR_DEFCONFIG_URL"
          echo "=============== defconfig differences: author (-) vs this repo (+) ==============="
          diff -u work/author_defconfig "arch/$ARCH/configs/$DEFCONFIG" > work/defconfig.diff || true
          cat work/defconfig.diff
          echo "=============== end of differences ==============="
          cp work/defconfig.diff artifacts/defconfig.diff
          if [ "$USE_AUTHOR_DEFCONFIG" = "true" ]; then
            echo "::warning::use_author_defconfig is ON, building with the author's defconfig instead of yours"
            cp work/author_defconfig "arch/$ARCH/configs/$DEFCONFIG"
          fi

      - name: Configure
        run: |
          source "$RUNNER_TEMP/mk.sh"
          mk "$DEFCONFIG"

      - name: Config report
        run: |
          source "$RUNNER_TEMP/mk.sh"
          echo "Kernel release: $(mk -s kernelrelease 2>/dev/null | tail -n1)"
          grep -E '^(# )?CONFIG_(LOCALVERSION|DM_VERITY|DM_ANDROID_VERITY|CC_STACKPROTECTOR|LTO|CC_OPTIMIZE|MODVERSIONS|MODULE_FORCE|BUILD_ARM64_APPENDED_DTB_IMAGE)' out/.config || true
          if grep -q '^# CONFIG_DM_VERITY is not set' out/.config; then
            echo "::warning::CONFIG_DM_VERITY is disabled. With verified boot still enabled on the phone this commonly causes a bootloop. Flash a disabled vbmeta tar."
          fi

      - name: Build
        run: |
          source "$RUNNER_TEMP/mk.sh"
          # full log goes to build.log, only the compiler-support spam is hidden on the console
          mk 2>&1 | tee build.log | { grep -viE 'gcc.*unsupported|unsupported.*gcc' || true; }

      - name: Pick kernel image
        run: |
          K=out/arch/arm64/boot/Image
          if [ ! -f "$K" ]; then
            echo "No $K produced. Contents of out/arch/arm64/boot:"
            ls -la out/arch/arm64/boot || true
            exit 1
          fi
          echo "KERNEL_IMAGE=$K" >> "$GITHUB_ENV"
          cp "$K" artifacts/Image
          ls -lh "$K"
          strings -a "$K" | grep -m1 'Linux version' || true

      # The normal build already compiles every driver set to =m, so this only collects them.
      - name: Collect kernel modules
        if: env.UPLOAD_MODULES == 'true'
        run: |
          mkdir -p artifacts/modules
          STRIP="$(ls "$PWD"/toolchain/bin/aarch64-linux-*-strip | head -n1)"

          dups=$(find out -name '*.ko' -printf '%f\n' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::warning::Several modules share a file name, extra copies get a numbered suffix: $dups"
          fi
          find out -name '*.ko' -exec cp --backup=numbered {} artifacts/modules/ \;

          # smaller upload: drop debug info only, symbols stay so the modules still load
          find artifacts/modules -name '*.ko' -exec "$STRIP" --strip-debug {} \;

          echo "---- kernel modules built (file, size, vermagic) ----"
          for f in artifacts/modules/*.ko; do
            if [ ! -e "$f" ]; then
              echo "::warning::No .ko files were built. Every driver is built into the kernel (=y) or CONFIG_MODULES is off."
              break
            fi
            echo "$(basename "$f")  $(stat -c %s "$f") bytes  $(strings -a "$f" | grep -m1 '^vermagic=' || echo 'vermagic not found')"
          done | tee artifacts/modules/modules_list.txt

      - name: Get stock boot.img
        id: stock
        run: |
          source "$RUNNER_TEMP/retry.sh"
          if [ -n "$STOCK_BOOT_URL" ]; then
            retry wget -q -O work/stock_boot.img "$STOCK_BOOT_URL"
          elif [ -f s-kernel/boot.img ]; then
            cp s-kernel/boot.img work/stock_boot.img
          fi
          if [ -s work/stock_boot.img ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No stock boot.img found (s-kernel/boot.img or stock_boot_url), only the raw kernel was built."
          fi

      - name: Repack boot.img
        if: steps.stock.outputs.have == 'true'
        run: |
          source "$RUNNER_TEMP/retry.sh"
          retry git clone -q --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg work/mkbootimg
          retry git clone -q --depth 1 https://android.googlesource.com/platform/external/avb work/avb
          cd work
          python3 mkbootimg/unpack_bootimg.py \
            --boot_img stock_boot.img \
            --out unpacked \
            --format=mkbootimg > mkargs.txt
          echo "---- stock boot.img parameters ----"
          cat mkargs.txt
          echo "-----------------------------------"
          ls -la unpacked
          cp mkargs.txt "$GITHUB_WORKSPACE/artifacts/mkargs.txt"
          OLD=$(stat -c %s unpacked/kernel)
          NEW=$(stat -c %s "$GITHUB_WORKSPACE/$KERNEL_IMAGE")
          echo "stock kernel: $OLD bytes, new kernel: $NEW bytes"
          cp "$GITHUB_WORKSPACE/$KERNEL_IMAGE" unpacked/kernel
          python3 - <<'PY'
          import shlex, subprocess
          args = shlex.split(open('mkargs.txt').read())
          cmd = ['python3', 'mkbootimg/mkbootimg.py', *args, '-o', 'boot.img']
          print('Running:', ' '.join(cmd))
          subprocess.run(cmd, check=True)
          PY
          # Samsung marker: only add it if the stock image had it
          if tail -c 16 stock_boot.img | grep -aq 'SEANDROIDENFORCE'; then
            printf 'SEANDROIDENFORCE' >> boot.img
            echo "Appended SEANDROIDENFORCE marker"
          fi
          # boot.img only, as requested
          mkdir -p "$GITHUB_WORKSPACE/artifacts/krnl"
          tar -H ustar -cf "$GITHUB_WORKSPACE/artifacts/krnl/Miracle-MSM8953.tar" boot.img
          ls -lh boot.img stock_boot.img "$GITHUB_WORKSPACE"/artifacts/krnl/*.tar

      - uses: actions/upload-artifact@v4
        with:
          name: Miracle-MSM8953
          path: artifacts/krnl/*
          if-no-files-found: error

      - name: Upload kernel modules
        if: env.UPLOAD_MODULES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Miracle-MSM8953-modules
          path: artifacts/modules/*
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore