name: Build kernel and boot.img.tar

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name"
        required: true
        default: "a02q_defconfig"
      stock_boot_url:
        description: "Optional direct URL to stock boot.img (otherwise stock/boot.img from the repo is used)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      ARCH: arm64
      DEFCONFIG: ${{ github.event.inputs.defconfig || 'a02q_defconfig' }}
      STOCK_BOOT_URL: ${{ github.event.inputs.stock_boot_url }}
      ALLOW_UNSAFE_WARNINGS: 1
      TC_TAG: android-10.0.0_r47

    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore exec bits
        run: |
          find . -path ./.git -prune -o -type f \
            \( -name '*.sh' -o -name '*.py' -o -name '*.pl' -o -path './scripts/*' -o -path './tools/*' \) \
            -exec chmod +x {} +

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            device-tree-compiler python2 python3 cpio xz-utils git wget

      - name: Fetch GCC 4.9 toolchains
        run: |
          base=https://android.googlesource.com/platform/prebuilts/gcc/linux-x86
          git clone -q --depth 1 -b "$TC_TAG" $base/aarch64/aarch64-linux-android-4.9 "$HOME/gcc64"
          git clone -q --depth 1 -b "$TC_TAG" $base/arm/arm-linux-androideabi-4.9 "$HOME/gcc32"
          echo "$HOME/gcc64/bin" >> "$GITHUB_PATH"
          echo "$HOME/gcc32/bin" >> "$GITHUB_PATH"

      - name: Check defconfig exists
        run: |
          if [ ! -f "arch/$ARCH/configs/$DEFCONFIG" ]; then
            echo "Defconfig '$DEFCONFIG' not found. Available:"
            ls arch/$ARCH/configs
            exit 1
          fi

      - name: Build
        run: |
          DTC=$(command -v dtc)
          [ -x tools/dtc ] && DTC=$PWD/tools/dtc
          MK=(make O=out ARCH=$ARCH PYTHON=python2
              "HOSTCC=gcc -Wno-deprecated-declarations"
              CROSS_COMPILE=aarch64-linux-android-
              CROSS_COMPILE_ARM32=arm-linux-androideabi-
              DTC_EXT=$DTC CONFIG_BUILD_ARM64_DT_OVERLAY=y)
          "${MK[@]}" $DEFCONFIG
          "${MK[@]}" -j"$(nproc)" 2>&1 | tee build.log

      - name: Pick kernel image
        run: |
          mkdir -p artifacts
          B=out/arch/$ARCH/boot
          for f in Image.gz-dtb Image.gz Image; do
            [ -f "$B/$f" ] && K="$B/$f" && break
          done
          [ -n "$K" ] || { echo "no kernel image in $B"; exit 1; }
          echo "KERNEL_IMAGE=$K" >> "$GITHUB_ENV"
          cp "$K" artifacts/
          ls -lh artifacts

      - name: Get stock boot.img
        id: stock
        run: |
          mkdir -p work
          if [ -n "$STOCK_BOOT_URL" ]; then
            wget -q -O work/stock_boot.img "$STOCK_BOOT_URL"
          elif [ -f s-kernel/boot.img ]; then
            cp s-kernel/boot.img work/stock_boot.img
          elif [ -f stock/boot.img ]; then
            cp stock/boot.img work/stock_boot.img
          fi
          if [ -s work/stock_boot.img ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No stock boot.img found (s-kernel/boot.img, stock/boot.img or stock_boot_url), only the raw kernel was built."
          fi

      - name: Repack boot.img
        if: steps.stock.outputs.have == 'true'
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg work/mkbootimg
          cd work
          python3 mkbootimg/unpack_bootimg.py \
            --boot_img stock_boot.img \
            --out unpacked \
            --format=mkbootimg > mkargs.txt
          cat mkargs.txt
          cp "$GITHUB_WORKSPACE/$KERNEL_IMAGE" unpacked/kernel
          RAMDISK=""
          for r in unpacked/ramdisk unpacked/ramdisk.cpio unpacked/ramdisk.gz unpacked/ramdisk.cpio.gz; do
            if [ -f "$r" ]; then
              RAMDISK="$r"
              break
            fi
          done
          if [ ! -s unpacked/kernel ]; then
            echo "Kernel not copied into unpacked/kernel"
            exit 1
          fi
          if [ -n "$RAMDISK" ]; then
            python3 mkbootimg/mkbootimg.py $(cat mkargs.txt) --kernel unpacked/kernel --ramdisk "$RAMDISK" -o boot.img
          else
            python3 mkbootimg/mkbootimg.py $(cat mkargs.txt) --kernel unpacked/kernel -o boot.img
          fi
          printf 'SEANDROIDENFORCE' >> boot.img
          
          # Pad boot.img to exactly 64 MB (67,108,864 bytes) for Samsung A02s partition specs
          truncate -s 64M boot.img
          
          tar -H ustar -cf "$GITHUB_WORKSPACE/artifacts/boot.img.tar" boot.img
          ls -lh boot.img "$GITHUB_WORKSPACE/artifacts/boot.img.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore